# =============================================================================
# Validate Models
# =============================================================================
#
# PURPOSE:
#   Automated model validation pipeline that runs all supported AI models on
#   real AMD Ryzen AI hardware (NPU, GPU) to verify they actually work. This
#   is the "proof" behind the supported models list in the documentation.
#   Results are committed back to the repo so the docs site always reflects
#   the latest verified state.
#
# ARCHITECTURE (3-stage pipeline):
#
#   1. discover    - Runs on ubuntu-latest (no hardware needed). Reads the
#                    hardware registry config and scans the docs to produce a
#                    JSON list of all models that need testing. This list is
#                    passed to the next stage as an artifact.
#
#   2. test        - Runs on a SELF-HOSTED runner with AMD NPU hardware
#                    (labels: self-hosted, windows, npu, ryzen-ai). Downloads
#                    the model list from discover, then runs three test
#                    harnesses in sequence:
#                      - harness_llm.py    (LLM models: Llama, Mistral, etc.)
#                      - harness_vision.py (Vision: ResNet, YOLO, etc.)
#                      - harness_audio.py  (Audio: Whisper, etc.)
#                    Each harness loads the model, runs inference, checks
#                    output validity, and records pass/fail + performance
#                    metrics to a JSON results file.
#
#   3. gate        - Runs on ubuntu-latest. Aggregates all test results,
#                    applies pass/fail thresholds, and writes the final
#                    verified model list to docs/reference/model-list-data.json.
#                    On main branch, commits and pushes this file so the docs
#                    site automatically shows which models are verified.
#
# SCHEDULE: Runs weekly (Monday 6:00 AM UTC) and on manual dispatch.
# This means the model validation table stays current without manual effort.
#
# SELF-HOSTED RUNNER REQUIREMENTS:
#   - Windows 11 with AMD Ryzen AI NPU
#   - Ryzen AI Software installed (ryzen-ai-1.7.0 conda environment)
#   - GitHub Actions runner registered with labels: self-hosted, windows,
#     npu, ryzen-ai
# =============================================================================

name: Validate Models

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # ---- Stage 1: Scan docs and config to build list of models to test ----
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Discover models
        run: |
          python website/ci/model-validation/discover.py \
            --config website/ci/hardware-registry.json \
            --output models-to-test.json

      - name: Upload models list
        uses: actions/upload-artifact@v4
        with:
          name: models-to-test
          path: models-to-test.json

  # ---- Stage 2: Run models on real AMD hardware (self-hosted runner) ----
  test:
    runs-on: [self-hosted, windows, npu, ryzen-ai]
    needs: discover
    steps:
      - uses: actions/checkout@v4

      - name: Download models list
        uses: actions/download-artifact@v4
        with:
          name: models-to-test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements
        run: pip install -r website/code-samples/requirements.txt

      - name: Run LLM harness
        run: |
          python website/ci/model-validation/harness_llm.py \
            --models models-to-test.json \
            --output results/llm-results.json

      - name: Run vision harness
        run: |
          python website/ci/model-validation/harness_vision.py \
            --models models-to-test.json \
            --output results/vision-results.json

      - name: Run audio harness
        run: |
          python website/ci/model-validation/harness_audio.py \
            --models models-to-test.json \
            --output results/audio-results.json

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: validation-results
          path: results/

  # ---- Stage 3: Aggregate results and update the verified model list ----
  gate:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: validation-results
          path: results/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run gate
        run: |
          python website/ci/model-validation/gate.py \
            --results results/ \
            --output docs/reference/model-list-data.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/reference/model-list-data.json
          git diff --staged --quiet || (git commit -m "chore: update model list from validation" && git push)

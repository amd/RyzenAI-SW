# =============================================================================
# Test Code Samples
# =============================================================================
# The "docs as code" accuracy gate: code in the docs must actually work.
#   1. syntax-check  - python syntax checks for every block (cloud, no hardware)
#   2. test-hardware - EXECUTES every runnable block on real AMD hardware via a
#                      self-hosted runner. Devices are configurable with the
#                      `DOCS_CI_DEVICES` repo variable (JSON array; default
#                      ["halo"] = the local Strix Halo box). Add more runners by
#                      labelling them and extending that variable - no edits
#                      here. See the "Runners" section of scripts/README.md.
# Failing pages are uploaded so Notify Owner can route to the page owner.
#
# Test-by-default (see .github/scripts/extract_code_blocks.py):
#   ```python / ```powershell / ```bash  -> EXECUTED on every run
#   ```python npu                          -> executed; device-scoped (cpu|gpu|npu)
#   ```bash notest                         -> the only opt-out: skipped
#   ```cpp / ```text / ```json             -> non-runnable -> recorded "skip"
# =============================================================================

name: Test Code Samples

on:
  pull_request:
    paths: ['docs/**']
  push:
    branches: [main, bconsolvo]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax checks (no hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install linters (YAML format check)
        run: pip install pyyaml
      - name: Syntax + format check code blocks
        run: python .github/scripts/extract_code_blocks.py --syntax-only --docs docs --failed-pages failed-pages-syntax.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-pages-syntax
          path: failed-pages-syntax.txt

  test-hardware:
    name: Execute on ${{ matrix.hw }}
    needs: syntax-check
    strategy:
      fail-fast: false
      matrix:
        # Which device labels to run on. Configurable per-repo WITHOUT editing
        # this file: set the `DOCS_CI_DEVICES` repo variable to a JSON array,
        # e.g. ["halo","stxp","krk"]. Defaults to ["halo"] (the local Strix
        # Halo runner). Each value must be a runner label (see RUNNERS section
        # of .github/scripts/README.md): halo = Strix Halo, stxp = Strix Point.
        hw: ${{ fromJSON(vars.DOCS_CI_DEVICES || '["halo"]') }}
    # Runner selection: [self-hosted, <OS>, <device>]. OS label is configurable
    # via DOCS_CI_OS (default "Windows"); device comes from the matrix above.
    runs-on: [self-hosted, "${{ vars.DOCS_CI_OS || 'Windows' }}", "${{ matrix.hw }}"]
    env:
      # The Ryzen AI conda env on the runner (NPU/GPU/CPU providers installed).
      # Override per-repo with the RYZEN_AI_ENV variable.
      RYZEN_AI_ENV: ${{ vars.RYZEN_AI_ENV || 'ryzen-ai-1.7.1' }}
    steps:
      - uses: actions/checkout@v4
      # Execute inside the Ryzen AI conda env so `python` blocks see the NPU
      # (VitisAIExecutionProvider), GPU (DmlExecutionProvider), and CPU.
      - name: Execute code blocks on hardware
        shell: powershell
        run: conda run --no-capture-output -n $env:RYZEN_AI_ENV python .github/scripts/extract_code_blocks.py --run --docs docs --output-json code-results-${{ matrix.hw }}.json --failed-pages failed-pages-${{ matrix.hw }}.txt
      - name: Build per-page report
        if: always()
        shell: powershell
        run: python .github/scripts/report.py --results code-results-${{ matrix.hw }}.json --docs docs --out CODE_TEST_REPORT-${{ matrix.hw }}.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-report-${{ matrix.hw }}
          path: |
            code-results-${{ matrix.hw }}.json
            CODE_TEST_REPORT-${{ matrix.hw }}.md
            failed-pages-${{ matrix.hw }}.txt

  # ---- Record this run to the CI history (dashboard data) ----
  record:
    needs: [syntax-check, test-hardware]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build page results
        run: python .github/scripts/extract_code_blocks.py --syntax-only --docs docs --output-json code-results.json --failed-pages failed-pages.txt || true
      - name: Append run to ci-history.json
        env:
          RUN_STATUS: ${{ (needs.syntax-check.result == 'success' && needs.test-hardware.result == 'success') && 'success' || 'failure' }}
        run: |
          python .github/scripts/record_run.py \
            --workflow "Test Code Samples" \
            --status "$RUN_STATUS" \
            --code-results code-results.json \
            --history .github/scripts/ci-history.json
      - name: Commit history (main) or upload artifact
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/scripts/ci-history.json
            git diff --staged --quiet || (git commit -m "ci: record docs CI run [skip ci]" && git push)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ci-history
          path: .github/scripts/ci-history.json

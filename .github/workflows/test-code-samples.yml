# =============================================================================
# Test Code Samples
# =============================================================================
# The "docs as code" accuracy gate: code in the docs must actually work.
#   1. syntax-check  - python syntax checks for every block (cloud, no hardware)
#   2. test-hardware - executes blocks tagged `test` on real AMD hardware,
#                      on the AMD Playbooks self-hosted Windows runner pool.
#                      v1 scope: Strix Point (stxp) and Strix Halo (halo) only.
#                      Requires our repo to be added to the org runner group
#                      that owns these machines (see .github/scripts/RUNNERS.md).
# Failing pages are uploaded so Notify Owner can route to the page owner.
#
# Code-block conventions (see .github/scripts/extract_code_blocks.py):
#   ```python          -> executed by default (also syntax-checked)
#   ```python npu      -> executed; device-scoped (cpu|gpu|npu)
#   ```bash notest     -> skipped entirely
# Test-by-default: every runnable block runs unless tagged `notest`.
# =============================================================================

name: Test Code Samples

on:
  pull_request:
    paths: ['docs/**/*.mdx']
  push:
    branches: [main]
    paths: ['docs/**/*.mdx']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    name: Syntax checks (no hardware)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Syntax-check code blocks
        run: python .github/scripts/extract_code_blocks.py --syntax-only --docs docs --failed-pages failed-pages-syntax.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-pages-syntax
          path: failed-pages-syntax.txt

  test-hardware:
    name: Execute on ${{ matrix.hw }}
    needs: syntax-check
    strategy:
      fail-fast: false
      matrix:
        # Device labels match the AMD Playbooks runner pool (see
        # amd/playbooks .github/workflows/test-playbooks.yml):
        #   stxp = Strix Point, halo = Strix Halo.
        hw: [stxp, halo]
    # Reuse the AMD Playbooks self-hosted Windows runner pool.
    # Label scheme: [self-hosted, Windows, <device>] (capital "Windows").
    runs-on: [self-hosted, Windows, "${{ matrix.hw }}"]
    env:
      # The Ryzen AI conda env on the runner (NPU/GPU/CPU providers installed).
      # Override per-repo with the RYZEN_AI_ENV variable.
      RYZEN_AI_ENV: ${{ vars.RYZEN_AI_ENV || 'ryzen-ai-1.7.1' }}
    steps:
      - uses: actions/checkout@v4
      # Execute inside the Ryzen AI conda env so `python` blocks see the NPU
      # (VitisAIExecutionProvider), GPU (DmlExecutionProvider), and CPU.
      - name: Execute code blocks on hardware
        shell: powershell
        run: conda run --no-capture-output -n $env:RYZEN_AI_ENV python .github/scripts/extract_code_blocks.py --run --docs docs --failed-pages failed-pages-${{ matrix.hw }}.txt
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-pages-${{ matrix.hw }}
          path: failed-pages-${{ matrix.hw }}.txt

  # ---- Record this run to the CI history (dashboard data) ----
  record:
    needs: [syntax-check, test-hardware]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build page results
        run: python .github/scripts/extract_code_blocks.py --syntax-only --docs docs --output-json code-results.json --failed-pages failed-pages.txt || true
      - name: Append run to ci-history.json
        env:
          RUN_STATUS: ${{ (needs.syntax-check.result == 'success' && needs.test-hardware.result == 'success') && 'success' || 'failure' }}
        run: |
          python .github/scripts/record_run.py \
            --workflow "Test Code Samples" \
            --status "$RUN_STATUS" \
            --code-results code-results.json \
            --history .github/scripts/ci-history.json
      - name: Commit history (main) or upload artifact
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .github/scripts/ci-history.json
            git diff --staged --quiet || (git commit -m "ci: record docs CI run [skip ci]" && git push)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ci-history
          path: .github/scripts/ci-history.json
